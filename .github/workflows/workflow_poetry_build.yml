name: Workflow poetry_build
on:
  workflow_dispatch:

jobs:
  poetry_build:
    runs_on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: apt install pipx
      - run: pipx install poetry==1.8.4
      - run: poetry build
      - run: poetry config --list


